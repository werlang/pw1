<header> </header>

<h1 id="programa%C3%A7%C3%A3o-web-i">Programação Web I</h1>
<h2 id="introdu%C3%A7%C3%A3o-a-apis-e-servi%C3%A7os-web-no-php">Introdução a APIs e Serviços Web no PHP</h2>
<p>Prof. Pablo Werlang<br />
<a href="mailto:pablowerlang@ifsul.edu.br">pablowerlang@ifsul.edu.br</a></p>
<footer>Instituto Federal Sul-rio-grandense | Campus Charqueadas</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-header=" " data-footer="Instituto Federal Sul-rio-grandense | Campus Charqueadas" data-theme="ifsul" lang="pt-BR" style="--header: ;--footer:Instituto Federal Sul-rio-grandense | Campus Charqueadas;--theme:ifsul;">
<header> </header>
<h1 id="apis-e-servi%C3%A7os-web">APIs e Serviços Web</h1>
<h2 id="o-novo-papel-do-php-no-servidor">O novo papel do PHP no servidor</h2>
<div class="grid grid-cols-2 gap-6">
<div>
<ul>
<li>O PHP deixa de misturar lógica com tags HTML</li>
<li>Assume o papel de <strong>serviço de backend</strong></li>
<li>Recebe requisições e processa regras de negócio</li>
<li>Devolve dados puros em formato <strong>JSON</strong></li>
</ul>
</div>
<div class="media flex h-full items-center justify-end">
<img class="h-full" src="../../marp/assets/08-api.png" alt="Comunicação CLiente-servidor com API" />
</div>
</div>
</div>
<footer>Instituto Federal Sul-rio-grandense | Campus Charqueadas</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-header=" " data-footer="Instituto Federal Sul-rio-grandense | Campus Charqueadas" data-theme="ifsul" lang="pt-BR" style="--header: ;--footer:Instituto Federal Sul-rio-grandense | Campus Charqueadas;--theme:ifsul;">
<header> </header>
<h1 id="apis-e-servi%C3%A7os-web-1">APIs e Serviços Web</h1>
<h2 id="arquitetura-cliente-servidor">Arquitetura Cliente-Servidor</h2>
<div class="grid grid-cols-2 gap-6">
<div>
<p><strong>Qualquer Cliente</strong></p>
<ul>
<li>Cuida da interface ou do consumo</li>
<li>Dispara eventos e requisições</li>
<li>Exemplos:
<ul>
<li>Navegador Web</li>
<li>Frontend JS com <code>fetch()</code></li>
<li>Aplicativo Mobile</li>
<li>Ferramenta de Testes</li>
</ul>
</li>
</ul>
</div>
<div>
<p><strong>Servidor (Backend / API)</strong></p>
<ul>
<li>Cuida da segurança e regras</li>
<li>Acessa banco de dados e arquivos</li>
<li>Valida entradas de forma defensiva</li>
<li>Devolve respostas padronizadas em JSON</li>
</ul>
</div>
</div>
<footer>Instituto Federal Sul-rio-grandense | Campus Charqueadas</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-header=" " data-footer="Instituto Federal Sul-rio-grandense | Campus Charqueadas" data-theme="ifsul" lang="pt-BR" style="--header: ;--footer:Instituto Federal Sul-rio-grandense | Campus Charqueadas;--theme:ifsul;">
<header> </header>
<h1 id="apis-e-servi%C3%A7os-web-2">APIs e Serviços Web</h1>
<h2 id="o-que-%C3%A9-uma-api">O que é uma API?</h2>
<ul>
<li><strong>API</strong> = <em>Application Programming Interface</em></li>
<li>É a ponte de comunicação entre o cliente e o servidor</li>
<li>Uma API bem projetada <strong>atende a qualquer cliente</strong> de forma agnóstica</li>
</ul>
<div class="media mx-auto mt-4">
<blockquote>
<p><strong>Analogia do Restaurante:</strong><br />
O cliente faz o pedido no cardápio <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> o garçom (API) leva até a cozinha <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> a cozinha (PHP) prepara o prato e entrega exatamente o que foi pedido (JSON).</p>
</blockquote>
</div>
<footer>Instituto Federal Sul-rio-grandense | Campus Charqueadas</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-header=" " data-footer="Instituto Federal Sul-rio-grandense | Campus Charqueadas" data-theme="ifsul" lang="pt-BR" style="--header: ;--footer:Instituto Federal Sul-rio-grandense | Campus Charqueadas;--theme:ifsul;">
<header> </header>
<h1 id="apis-e-servi%C3%A7os-web-3">APIs e Serviços Web</h1>
<h2 id="anatomia-http-envelope-e-carta">Anatomia HTTP: Envelope e Carta</h2>
<p>Toda mensagem na web é dividida em duas partes essenciais:</p>
<div class="grid grid-cols-2 gap-6">
<div>
<p><strong>Cabeçalhos (<em>Headers</em>) = O Envelope</strong></p>
<ul>
<li>Instruções técnicas e metadados</li>
<li>Formato do conteúdo (<code>Content-Type</code>)</li>
<li>Código de status (<code>200</code>, <code>400</code>, <code>404</code>)</li>
<li>Data, tamanho e identificação</li>
</ul>
</div>
<div>
<p><strong>Corpo (<em>Body</em>) = A Carta</strong></p>
<ul>
<li>A carga real de dados (<em>payload</em>)</li>
<li>O texto JSON retornado</li>
<li>Ou os dados enviados por formulário</li>
<li>Pode ir vazio em requisições <code>GET</code></li>
</ul>
</div>
</div>
<footer>Instituto Federal Sul-rio-grandense | Campus Charqueadas</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-header=" " data-footer="Instituto Federal Sul-rio-grandense | Campus Charqueadas" data-theme="ifsul" lang="pt-BR" style="--header: ;--footer:Instituto Federal Sul-rio-grandense | Campus Charqueadas;--theme:ifsul;">
<header> </header>
<h1 id="apis-e-servi%C3%A7os-web-4">APIs e Serviços Web</h1>
<h2 id="o-b%C3%A1sico-do-rest-recursos-na-url">O básico do REST: Recursos na URL</h2>
<ul>
<li>Um <strong>recurso</strong> representa a entidade manipulada</li>
<li>Usamos <strong>substantivos</strong> para nomear as rotas</li>
</ul>
<div class="grid grid-cols-2 gap-6">
<div>
<p><strong>Abordagem Antiga (com verbos) <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/></strong></p>
<ul>
<li><code>/buscarEstudantes.php</code></li>
<li><code>/salvarEstudante.php</code></li>
<li><code>/excluirEstudante.php</code></li>
</ul>
</div>
<div>
<p><strong>Abordagem REST (com recursos) <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></strong></p>
<ul>
<li><code>/estudantes</code> (com <code>GET</code>)</li>
<li><code>/estudantes</code> (com <code>POST</code>)</li>
<li><code>/estudantes</code> (com <code>DELETE</code>)</li>
</ul>
</div>
</div>
<footer>Instituto Federal Sul-rio-grandense | Campus Charqueadas</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-header=" " data-footer="Instituto Federal Sul-rio-grandense | Campus Charqueadas" data-theme="ifsul" lang="pt-BR" style="--header: ;--footer:Instituto Federal Sul-rio-grandense | Campus Charqueadas;--theme:ifsul;">
<header> </header>
<h1 id="apis-e-servi%C3%A7os-web-5">APIs e Serviços Web</h1>
<h2 id="o-b%C3%A1sico-do-rest-verbos-http">O básico do REST: Verbos HTTP</h2>
<p>O verbo HTTP indica a <strong>intenção</strong> da ação:</p>
<table>
<thead>
<tr>
<th style="text-align:left">Verbo</th>
<th style="text-align:left">Intenção</th>
<th style="text-align:left">O que o PHP faz</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong><code>GET</code></strong></td>
<td style="text-align:left">Ler / Consultar</td>
<td style="text-align:left">Busca dados sem alterar o servidor</td>
</tr>
<tr>
<td style="text-align:left"><strong><code>POST</code></strong></td>
<td style="text-align:left">Criar / Inserir</td>
<td style="text-align:left">Recebe dados novos e salva no sistema</td>
</tr>
<tr>
<td style="text-align:left"><strong><code>PUT</code></strong></td>
<td style="text-align:left">Atualizar</td>
<td style="text-align:left">Altera informações de um registro existente</td>
</tr>
<tr>
<td style="text-align:left"><strong><code>DELETE</code></strong></td>
<td style="text-align:left">Excluir</td>
<td style="text-align:left">Remove um registro do sistema</td>
</tr>
</tbody>
</table>
<footer>Instituto Federal Sul-rio-grandense | Campus Charqueadas</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-header=" " data-footer="Instituto Federal Sul-rio-grandense | Campus Charqueadas" data-theme="ifsul" lang="pt-BR" style="--header: ;--footer:Instituto Federal Sul-rio-grandense | Campus Charqueadas;--theme:ifsul;">
<header> </header>
<h1 id="apis-e-servi%C3%A7os-web-6">APIs e Serviços Web</h1>
<h2 id="o-ecossistema-de-clientes-http">O ecossistema de Clientes HTTP</h2>
<ol>
<li><strong>Navegadores Web:</strong> consultas diretas <code>GET</code> na barra de endereços</li>
<li><strong>JavaScript no Frontend (<code>fetch</code>):</strong> atualiza o DOM em segundo plano</li>
<li><strong>Linha de Comando (<code>curl</code>):</strong> inspeção rápida no terminal</li>
<li><strong>Clientes de Teste (Bruno, Postman):</strong> simulam qualquer requisição no desenvolvimento</li>
</ol>

<header> </header>
<h1 id="apis-e-servi%C3%A7os-web-7">APIs e Serviços Web</h1>
<h2 id="testando-apis-no-desenvolvimento">Testando APIs no desenvolvimento</h2>
<ul>
<li>Como testar o backend antes de criar o frontend?</li>
<li>Usamos o <strong>Bruno</strong> (extensão leve e open-source no VS Code)</li>
<li>Salva requisições em <strong>arquivos locais YAML (<code>.yaml</code>)</strong></li>
<li>Fica versionado no Git junto com seus scripts PHP!</li>
</ul>
<pre><code class="language-text">meu-projeto/
├── api.php
└── collection/
    ├── buscar.yaml
    └── cadastrar.yaml
</code></pre>
<footer>Instituto Federal Sul-rio-grandense | Campus Charqueadas</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-header=" " data-footer="Instituto Federal Sul-rio-grandense | Campus Charqueadas" data-theme="ifsul" lang="pt-BR" style="--header: ;--footer:Instituto Federal Sul-rio-grandense | Campus Charqueadas;--theme:ifsul;">
<header> </header>
<h1 id="apis-e-servi%C3%A7os-web-8">APIs e Serviços Web</h1>
<h2 id="requisi%C3%A7%C3%B5es-de-teste-em-yaml">Requisições de teste em YAML</h2>
<div class="grid grid-cols-2 gap-6">
<div>
<p><strong>Consulta GET (<code>buscar.yaml</code>)</strong></p>
<pre><code class="language-yaml"><span class="hljs-attr">name:</span> <span class="hljs-string">Consultar</span> <span class="hljs-string">Alunos</span>
<span class="hljs-attr">type:</span> <span class="hljs-string">http</span>
<span class="hljs-attr">seq:</span> <span class="hljs-number">1</span>

<span class="hljs-attr">request:</span>
  <span class="hljs-attr">method:</span> <span class="hljs-string">GET</span>
  <span class="hljs-attr">url:</span> <span class="hljs-string">http://localhost/alunos.php?turma=2AT</span>
</code></pre>
</div>
<div>
<p><strong>Cadastro POST (<code>cadastrar.yaml</code>)</strong></p>
<pre><code class="language-yaml"><span class="hljs-attr">name:</span> <span class="hljs-string">Cadastrar</span> <span class="hljs-string">Aluno</span>
<span class="hljs-attr">type:</span> <span class="hljs-string">http</span>
<span class="hljs-attr">seq:</span> <span class="hljs-number">2</span>

<span class="hljs-attr">request:</span>
  <span class="hljs-attr">method:</span> <span class="hljs-string">POST</span>
  <span class="hljs-attr">url:</span> <span class="hljs-string">http://localhost/alunos.php</span>
  <span class="hljs-attr">headers:</span>
    <span class="hljs-attr">Content-Type:</span> <span class="hljs-string">application/json</span>
  <span class="hljs-attr">body:</span>
    <span class="hljs-attr">type:</span> <span class="hljs-string">json</span>
    <span class="hljs-attr">data:</span>
      <span class="hljs-attr">nome:</span> <span class="hljs-string">Ana</span> <span class="hljs-string">Souza</span>
</code></pre>
</div>
</div>
<footer>Instituto Federal Sul-rio-grandense | Campus Charqueadas</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-header=" " data-footer="Instituto Federal Sul-rio-grandense | Campus Charqueadas" data-theme="ifsul" lang="pt-BR" style="--header: ;--footer:Instituto Federal Sul-rio-grandense | Campus Charqueadas;--theme:ifsul;">
<header> </header>
<h1 id="apis-e-servi%C3%A7os-web-9">APIs e Serviços Web</h1>
<h2 id="retornando-json-com-php">Retornando JSON com PHP</h2>
<p>Três passos para transformar o PHP em uma API:</p>
<pre><code class="language-php"><span class="hljs-meta">&lt;?php</span>
<span class="hljs-comment">// 1. Avisa o cliente que a resposta é JSON</span>
<span class="hljs-title function_ invoke__">header</span>(<span class="hljs-string">&quot;Content-Type: application/json&quot;</span>);

<span class="hljs-comment">// 2. Monta os dados em array/variável</span>
<span class="hljs-variable">$resposta</span> = [
    <span class="hljs-string">&quot;status&quot;</span> =&gt; <span class="hljs-string">&quot;OK&quot;</span>,
    <span class="hljs-string">&quot;mensagem&quot;</span> =&gt; <span class="hljs-string">&quot;API funcionando com sucesso!&quot;</span>
];

<span class="hljs-comment">// 3. Serializa e imprime na saída</span>
<span class="hljs-keyword">echo</span> <span class="hljs-title function_ invoke__">json_encode</span>(<span class="hljs-variable">$resposta</span>);
</code></pre>
<p><strong>Sem <code>header()</code>, o cliente pode tratar o retorno como página HTML comum.</strong></p>
<footer>Instituto Federal Sul-rio-grandense | Campus Charqueadas</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-header=" " data-footer="Instituto Federal Sul-rio-grandense | Campus Charqueadas" data-theme="ifsul" lang="pt-BR" style="--header: ;--footer:Instituto Federal Sul-rio-grandense | Campus Charqueadas;--theme:ifsul;">
<header> </header>
<h1 id="apis-e-servi%C3%A7os-web-10">APIs e Serviços Web</h1>
<h2 id="o-contrato-padr%C3%A3o-da-disciplina">O contrato padrão da disciplina</h2>
<p>Adotamos um envelope consistente em todas as respostas:</p>
<div class="grid grid-cols-2 gap-6">
<div>
<p><strong>Sucesso (<code>status: &quot;OK&quot;</code>)</strong></p>
<pre><code class="language-json"><span class="hljs-punctuation">{</span>
  <span class="hljs-attr">&quot;status&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;OK&quot;</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;result&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-punctuation">{</span>
    <span class="hljs-attr">&quot;id&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-number">42</span><span class="hljs-punctuation">,</span>
    <span class="hljs-attr">&quot;nome&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;Ana Souza&quot;</span>
  <span class="hljs-punctuation">}</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;message&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;Encontrado com sucesso&quot;</span>
<span class="hljs-punctuation">}</span>
</code></pre>
</div>
<div>
<p><strong>Erro (<code>status: &quot;error&quot;</code>)</strong></p>
<pre><code class="language-json"><span class="hljs-punctuation">{</span>
  <span class="hljs-attr">&quot;status&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;error&quot;</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;result&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-literal"><span class="hljs-keyword">null</span></span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;message&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;Matrícula não informada&quot;</span>
<span class="hljs-punctuation">}</span>
</code></pre>
</div>
</div>
<footer>Instituto Federal Sul-rio-grandense | Campus Charqueadas</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-header=" " data-footer="Instituto Federal Sul-rio-grandense | Campus Charqueadas" data-theme="ifsul" lang="pt-BR" style="--header: ;--footer:Instituto Federal Sul-rio-grandense | Campus Charqueadas;--theme:ifsul;">
<header> </header>
<h1 id="apis-e-servi%C3%A7os-web-11">APIs e Serviços Web</h1>
<h2 id="c%C3%B3digos-de-status-com-http_response_code">Códigos de status com <code>http_response_code()</code></h2>
<p>O código numérico formaliza o resultado no cabeçalho HTTP:</p>
<pre><code class="language-php"><span class="hljs-title function_ invoke__">http_response_code</span>(<span class="hljs-number">400</span>); <span class="hljs-comment">// 400 Bad Request</span>

<span class="hljs-keyword">echo</span> <span class="hljs-title function_ invoke__">json_encode</span>([
    <span class="hljs-string">&quot;status&quot;</span> =&gt; <span class="hljs-string">&quot;error&quot;</span>,
    <span class="hljs-string">&quot;message&quot;</span> =&gt; <span class="hljs-string">&quot;Parâmetros ausentes.&quot;</span>
]);
</code></pre>
<ul>
<li><strong><code>200 OK</code></strong>: consulta ou operação realizada com sucesso</li>
<li><strong><code>201 Created</code></strong>: novo registro cadastrado com sucesso</li>
<li><strong><code>400 Bad Request</code></strong>: dados obrigatórios ausentes ou inválidos</li>
<li><strong><code>401 Unauthorized</code></strong>: usuário não autenticado</li>
<li><strong><code>403 Forbidden</code></strong>: usuário não autorizado a acessar o recurso</li>
<li><strong><code>404 Not Found</code></strong>: recurso ou item não encontrado</li>
<li><strong><code>500 Internal Server Error</code></strong>: erro inesperado no backend</li>
</ul>
<footer>Instituto Federal Sul-rio-grandense | Campus Charqueadas</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-header=" " data-footer="Instituto Federal Sul-rio-grandense | Campus Charqueadas" data-theme="ifsul" lang="pt-BR" style="--header: ;--footer:Instituto Federal Sul-rio-grandense | Campus Charqueadas;--theme:ifsul;">
<header> </header>
<h1 id="apis-e-servi%C3%A7os-web-12">APIs e Serviços Web</h1>
<h2 id="identificando-o-m%C3%A9todo-no-php">Identificando o método no PHP</h2>
<p>Consulte <code>$_SERVER['REQUEST_METHOD']</code> para saber qual verbo foi disparado:</p>
<pre><code class="language-php"><span class="hljs-meta">&lt;?php</span>
<span class="hljs-title function_ invoke__">header</span>(<span class="hljs-string">&quot;Content-Type: application/json&quot;</span>);

<span class="hljs-variable">$metodo</span> = <span class="hljs-variable">$_SERVER</span>[<span class="hljs-string">&quot;REQUEST_METHOD&quot;</span>];

<span class="hljs-keyword">if</span> (<span class="hljs-variable">$metodo</span> === <span class="hljs-string">&quot;GET&quot;</span>) {
    <span class="hljs-title function_ invoke__">http_response_code</span>(<span class="hljs-number">200</span>);
    <span class="hljs-keyword">echo</span> <span class="hljs-title function_ invoke__">json_encode</span>([<span class="hljs-string">&quot;status&quot;</span> =&gt; <span class="hljs-string">&quot;OK&quot;</span>, <span class="hljs-string">&quot;mensagem&quot;</span> =&gt; <span class="hljs-string">&quot;Leitura realizada&quot;</span>]);
    <span class="hljs-keyword">exit</span>;
}

<span class="hljs-keyword">if</span> (<span class="hljs-variable">$metodo</span> === <span class="hljs-string">&quot;POST&quot;</span>) {
    <span class="hljs-title function_ invoke__">http_response_code</span>(<span class="hljs-number">201</span>);
    <span class="hljs-keyword">echo</span> <span class="hljs-title function_ invoke__">json_encode</span>([<span class="hljs-string">&quot;status&quot;</span> =&gt; <span class="hljs-string">&quot;OK&quot;</span>, <span class="hljs-string">&quot;mensagem&quot;</span> =&gt; <span class="hljs-string">&quot;Cadastro realizado&quot;</span>]);
    <span class="hljs-keyword">exit</span>;
}
</code></pre>
<footer>Instituto Federal Sul-rio-grandense | Campus Charqueadas</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-header=" " data-footer="Instituto Federal Sul-rio-grandense | Campus Charqueadas" data-theme="ifsul" lang="pt-BR" style="--header: ;--footer:Instituto Federal Sul-rio-grandense | Campus Charqueadas;--theme:ifsul;">
<header> </header>
<h1 id="apis-e-servi%C3%A7os-web-13">APIs e Serviços Web</h1>
<h2 id="os-3-canais-de-entrada-no-php">Os 3 Canais de Entrada no PHP</h2>
<p>Como os dados chegam ao backend a partir de qualquer cliente:</p>
<div class="grid grid-cols-3 gap-4">
<div>
<p><strong>1. URL (<code>$_GET</code>)</strong></p>
<ul>
<li>Parâmetros na query string</li>
<li><code>?nome=Ana&amp;turma=2AT</code></li>
<li>Buscas, filtros e listagens</li>
</ul>
</div>
<div>
<p><strong>2. Formulário (<code>$_POST</code>)</strong></p>
<ul>
<li>Dados codificados no corpo</li>
<li>Formulários HTML ou <code>FormData</code></li>
<li>Cadastros e envios</li>
</ul>
</div>
<div>
<p><strong>3. JSON (<code>php://input</code>)</strong></p>
<ul>
<li>Objeto JSON no corpo</li>
<li>Cargas de SPAs e APIs</li>
<li>Leitura com <code>json_decode()</code></li>
</ul>
</div>
</div>
<footer>Instituto Federal Sul-rio-grandense | Campus Charqueadas</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-header=" " data-footer="Instituto Federal Sul-rio-grandense | Campus Charqueadas" data-theme="ifsul" lang="pt-BR" style="--header: ;--footer:Instituto Federal Sul-rio-grandense | Campus Charqueadas;--theme:ifsul;">
<header> </header>
<h1 id="apis-e-servi%C3%A7os-web-14">APIs e Serviços Web</h1>
<h2 id="canal-1-dados-via-url-com-_get">Canal 1: Dados via URL com <code>$_GET</code></h2>
<p>Requisição: <code>GET /calculadora.php?operacao=somar&amp;a=10&amp;b=5</code></p>
<pre><code class="language-php"><span class="hljs-meta">&lt;?php</span>
<span class="hljs-title function_ invoke__">header</span>(<span class="hljs-string">&quot;Content-Type: application/json&quot;</span>);

<span class="hljs-variable">$operacao</span> = <span class="hljs-variable">$_GET</span>[<span class="hljs-string">&quot;operacao&quot;</span>] ?? <span class="hljs-literal">null</span>;
<span class="hljs-variable">$a</span> = <span class="hljs-variable">$_GET</span>[<span class="hljs-string">&quot;a&quot;</span>] ?? <span class="hljs-literal">null</span>;
<span class="hljs-variable">$b</span> = <span class="hljs-variable">$_GET</span>[<span class="hljs-string">&quot;b&quot;</span>] ?? <span class="hljs-literal">null</span>;

<span class="hljs-keyword">if</span> (<span class="hljs-variable">$operacao</span> === <span class="hljs-literal">null</span> || <span class="hljs-variable">$a</span> === <span class="hljs-literal">null</span> || <span class="hljs-variable">$b</span> === <span class="hljs-literal">null</span>) {
    <span class="hljs-title function_ invoke__">http_response_code</span>(<span class="hljs-number">400</span>);
    <span class="hljs-keyword">echo</span> <span class="hljs-title function_ invoke__">json_encode</span>([<span class="hljs-string">&quot;status&quot;</span> =&gt; <span class="hljs-string">&quot;error&quot;</span>, <span class="hljs-string">&quot;message&quot;</span> =&gt; <span class="hljs-string">&quot;Informe operacao, a e b&quot;</span>]);
    <span class="hljs-keyword">exit</span>;
}

<span class="hljs-variable">$resultado</span> = (<span class="hljs-variable">$operacao</span> === <span class="hljs-string">&quot;somar&quot;</span>) ? (<span class="hljs-keyword">float</span>)<span class="hljs-variable">$a</span> + (<span class="hljs-keyword">float</span>)<span class="hljs-variable">$b</span> : <span class="hljs-literal">null</span>;

<span class="hljs-keyword">echo</span> <span class="hljs-title function_ invoke__">json_encode</span>([<span class="hljs-string">&quot;status&quot;</span> =&gt; <span class="hljs-string">&quot;OK&quot;</span>, <span class="hljs-string">&quot;resultado&quot;</span> =&gt; <span class="hljs-variable">$resultado</span>]);
</code></pre>
<footer>Instituto Federal Sul-rio-grandense | Campus Charqueadas</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-header=" " data-footer="Instituto Federal Sul-rio-grandense | Campus Charqueadas" data-theme="ifsul" lang="pt-BR" style="--header: ;--footer:Instituto Federal Sul-rio-grandense | Campus Charqueadas;--theme:ifsul;">
<header> </header>
<h1 id="apis-e-servi%C3%A7os-web-15">APIs e Serviços Web</h1>
<h2 id="canal-2-formul%C3%A1rios-com-_post">Canal 2: Formulários com <code>$_POST</code></h2>
<p>Dados enviados via formulário tradicional ou <code>FormData</code>:</p>
<pre><code class="language-php"><span class="hljs-meta">&lt;?php</span>
<span class="hljs-title function_ invoke__">header</span>(<span class="hljs-string">&quot;Content-Type: application/json&quot;</span>);

<span class="hljs-keyword">if</span> (<span class="hljs-variable">$_SERVER</span>[<span class="hljs-string">&quot;REQUEST_METHOD&quot;</span>] !== <span class="hljs-string">&quot;POST&quot;</span>) {
    <span class="hljs-title function_ invoke__">http_response_code</span>(<span class="hljs-number">405</span>);
    <span class="hljs-keyword">echo</span> <span class="hljs-title function_ invoke__">json_encode</span>([<span class="hljs-string">&quot;status&quot;</span> =&gt; <span class="hljs-string">&quot;error&quot;</span>, <span class="hljs-string">&quot;message&quot;</span> =&gt; <span class="hljs-string">&quot;Use POST&quot;</span>]);
    <span class="hljs-keyword">exit</span>;
}

<span class="hljs-variable">$nome</span> = <span class="hljs-title function_ invoke__">trim</span>(<span class="hljs-variable">$_POST</span>[<span class="hljs-string">&quot;nome&quot;</span>] ?? <span class="hljs-string">&quot;&quot;</span>);
<span class="hljs-variable">$email</span> = <span class="hljs-title function_ invoke__">trim</span>(<span class="hljs-variable">$_POST</span>[<span class="hljs-string">&quot;email&quot;</span>] ?? <span class="hljs-string">&quot;&quot;</span>);

<span class="hljs-keyword">if</span> (<span class="hljs-variable">$nome</span> === <span class="hljs-string">&quot;&quot;</span> || <span class="hljs-variable">$email</span> === <span class="hljs-string">&quot;&quot;</span>) {
    <span class="hljs-title function_ invoke__">http_response_code</span>(<span class="hljs-number">400</span>);
    <span class="hljs-keyword">echo</span> <span class="hljs-title function_ invoke__">json_encode</span>([<span class="hljs-string">&quot;status&quot;</span> =&gt; <span class="hljs-string">&quot;error&quot;</span>, <span class="hljs-string">&quot;message&quot;</span> =&gt; <span class="hljs-string">&quot;Campos obrigatórios&quot;</span>]);
    <span class="hljs-keyword">exit</span>;
}

<span class="hljs-title function_ invoke__">http_response_code</span>(<span class="hljs-number">201</span>);
<span class="hljs-keyword">echo</span> <span class="hljs-title function_ invoke__">json_encode</span>([<span class="hljs-string">&quot;status&quot;</span> =&gt; <span class="hljs-string">&quot;OK&quot;</span>, <span class="hljs-string">&quot;result&quot;</span> =&gt; [<span class="hljs-string">&quot;nome&quot;</span> =&gt; <span class="hljs-variable">$nome</span>, <span class="hljs-string">&quot;email&quot;</span> =&gt; <span class="hljs-variable">$email</span>]]);
</code></pre>
<footer>Instituto Federal Sul-rio-grandense | Campus Charqueadas</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-header=" " data-footer="Instituto Federal Sul-rio-grandense | Campus Charqueadas" data-theme="ifsul" lang="pt-BR" style="--header: ;--footer:Instituto Federal Sul-rio-grandense | Campus Charqueadas;--theme:ifsul;">
<header> </header>
<h1 id="apis-e-servi%C3%A7os-web-16">APIs e Serviços Web</h1>
<h2 id="canal-3-carga-json-com-phpinput">Canal 3: Carga JSON com <code>php://input</code></h2>
<p>O PHP <strong>não</strong> preenche <code>$_POST</code> quando recebe JSON puro:</p>
<pre><code class="language-php"><span class="hljs-meta">&lt;?php</span>
<span class="hljs-title function_ invoke__">header</span>(<span class="hljs-string">&quot;Content-Type: application/json&quot;</span>);

<span class="hljs-comment">// 1. Lê o fluxo bruto do corpo</span>
<span class="hljs-variable">$corpo</span> = <span class="hljs-title function_ invoke__">file_get_contents</span>(<span class="hljs-string">&quot;php://input&quot;</span>);

<span class="hljs-comment">// 2. Decodifica para array associativo do PHP</span>
<span class="hljs-variable">$dados</span> = <span class="hljs-title function_ invoke__">json_decode</span>(<span class="hljs-variable">$corpo</span>, <span class="hljs-literal">true</span>);

<span class="hljs-keyword">if</span> (!<span class="hljs-title function_ invoke__">is_array</span>(<span class="hljs-variable">$dados</span>) || <span class="hljs-keyword">empty</span>(<span class="hljs-variable">$dados</span>[<span class="hljs-string">&quot;titulo&quot;</span>])) {
    <span class="hljs-title function_ invoke__">http_response_code</span>(<span class="hljs-number">400</span>);
    <span class="hljs-keyword">echo</span> <span class="hljs-title function_ invoke__">json_encode</span>([<span class="hljs-string">&quot;status&quot;</span> =&gt; <span class="hljs-string">&quot;error&quot;</span>, <span class="hljs-string">&quot;message&quot;</span> =&gt; <span class="hljs-string">&quot;JSON inválido ou sem título&quot;</span>]);
    <span class="hljs-keyword">exit</span>;
}

<span class="hljs-title function_ invoke__">http_response_code</span>(<span class="hljs-number">201</span>);
<span class="hljs-keyword">echo</span> <span class="hljs-title function_ invoke__">json_encode</span>([<span class="hljs-string">&quot;status&quot;</span> =&gt; <span class="hljs-string">&quot;OK&quot;</span>, <span class="hljs-string">&quot;titulo&quot;</span> =&gt; <span class="hljs-variable">$dados</span>[<span class="hljs-string">&quot;titulo&quot;</span>]]);
</code></pre>
<footer>Instituto Federal Sul-rio-grandense | Campus Charqueadas</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-header=" " data-footer="Instituto Federal Sul-rio-grandense | Campus Charqueadas" data-theme="ifsul" lang="pt-BR" style="--header: ;--footer:Instituto Federal Sul-rio-grandense | Campus Charqueadas;--theme:ifsul;">
<header> </header>
<h1 id="apis-e-servi%C3%A7os-web-17">APIs e Serviços Web</h1>
<h2 id="resumo-dos-3-formatos-de-entrada">Resumo dos 3 formatos de entrada</h2>
<table>
<thead>
<tr>
<th style="text-align:left">Formato</th>
<th style="text-align:left">Como o cliente envia</th>
<th style="text-align:left">Cabeçalho do Cliente</th>
<th style="text-align:left">Como o PHP lê</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Query String</strong></td>
<td style="text-align:left">URL (<code>?a=1&amp;b=2</code>)</td>
<td style="text-align:left"><em>(Sem cabeçalho no corpo)</em></td>
<td style="text-align:left"><code>$_GET[&quot;campo&quot;]</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>Formulário</strong></td>
<td style="text-align:left">Corpo codificado</td>
<td style="text-align:left"><code>application/x-www-form-urlencoded</code></td>
<td style="text-align:left"><code>$_POST[&quot;campo&quot;]</code></td>
</tr>
<tr>
<td style="text-align:left"><strong>JSON Puro</strong></td>
<td style="text-align:left">Texto JSON no corpo</td>
<td style="text-align:left"><code>application/json</code></td>
<td style="text-align:left"><code>json_decode(file_get_contents(&quot;php://input&quot;), true)</code></td>
</tr>
</tbody>
</table>

<h1 id="apis-e-servi%C3%A7os-web-18">APIs e Serviços Web</h1>
<h2 id="valida%C3%A7%C3%A3o-defensiva-no-backend">Validação defensiva no backend</h2>
<p>Sempre valide os dados antes de prosseguir com a lógica:</p>
<pre><code class="language-php"><span class="hljs-variable">$erros</span> = [];
<span class="hljs-variable">$nome</span> = <span class="hljs-title function_ invoke__">trim</span>(<span class="hljs-variable">$_GET</span>[<span class="hljs-string">&quot;nome&quot;</span>] ?? <span class="hljs-string">&quot;&quot;</span>);
<span class="hljs-variable">$idade</span> = <span class="hljs-variable">$_GET</span>[<span class="hljs-string">&quot;idade&quot;</span>] ?? <span class="hljs-literal">null</span>;

<span class="hljs-keyword">if</span> (<span class="hljs-variable">$nome</span> === <span class="hljs-string">&quot;&quot;</span>) <span class="hljs-variable">$erros</span>[] = <span class="hljs-string">&quot;Nome é obrigatório&quot;</span>;
<span class="hljs-keyword">if</span> (<span class="hljs-variable">$idade</span> === <span class="hljs-literal">null</span> || !<span class="hljs-title function_ invoke__">is_numeric</span>(<span class="hljs-variable">$idade</span>)) <span class="hljs-variable">$erros</span>[] = <span class="hljs-string">&quot;Idade inválida&quot;</span>;

<span class="hljs-keyword">if</span> (!<span class="hljs-keyword">empty</span>(<span class="hljs-variable">$erros</span>)) {
    <span class="hljs-title function_ invoke__">http_response_code</span>(<span class="hljs-number">400</span>);
    <span class="hljs-keyword">echo</span> <span class="hljs-title function_ invoke__">json_encode</span>([<span class="hljs-string">&quot;status&quot;</span> =&gt; <span class="hljs-string">&quot;error&quot;</span>, <span class="hljs-string">&quot;erros&quot;</span> =&gt; <span class="hljs-variable">$erros</span>]);
    <span class="hljs-keyword">exit</span>; <span class="hljs-comment">// Importante: interrompe a execução!</span>
}
</code></pre>

<h1 id="apis-e-servi%C3%A7os-web-19">APIs e Serviços Web</h1>
<h2 id="erros-mais-comuns">Erros mais comuns</h2>
<ul>
<li><strong>Esquecer <code>header(&quot;Content-Type: application/json&quot;)</code></strong></li>
<li><strong>Deixar <code>echo</code> soltos ou tags HTML antes do <code>json_encode()</code></strong> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> corrompe o JSON!</li>
<li><strong>Tentar ler JSON usando <code>$_POST</code></strong> <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.025ex;" xmlns="http://www.w3.org/2000/svg" width="2.262ex" height="1.181ex" role="img" focusable="false" viewBox="0 -511 1000 522"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mo"><path data-c="2192" d="M56 237T56 250T70 270H835Q719 357 692 493Q692 494 692 496T691 499Q691 511 708 511H711Q720 511 723 510T729 506T732 497T735 481T743 456Q765 389 816 336T935 261Q944 258 944 250Q944 244 939 241T915 231T877 212Q836 186 806 152T761 85T740 35T732 4Q730 -6 727 -8T711 -11Q691 -11 691 0Q691 7 696 25Q728 151 835 230H70Q56 237 56 250Z"></path></g></g></g></svg></mjx-container> use <code>php://input</code></li>
<li><strong>Esquecer <code>http_response_code()</code> nos erros</strong></li>
<li><strong>Esquecer de colocar <code>exit</code> após responder com erro</strong></li>
</ul>

<h2 id="o-que-precisa-ficar">O que precisa ficar</h2>
<ol>
<li><strong>O backend entrega dados (JSON) para qualquer cliente de forma agnóstica</strong></li>
<li><strong>REST usa recursos na URL e verbos HTTP como intenção</strong></li>
<li><strong>Cabeçalhos (<em>headers</em>) carregam metadados; o corpo (<em>body</em>) carrega os dados</strong></li>
<li><strong>O PHP recebe dados por 3 canais: <code>$_GET</code>, <code>$_POST</code> e <code>php://input</code></strong></li>
<li><strong>Usamos o Bruno com arquivos YAML para testar nossos endpoints na prática</strong></li>
</ol>
