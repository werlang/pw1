<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking de Quiz</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="page">
        <section class="panel quiz-panel">
            <p class="eyebrow">Exercício localStorage</p>
            <h1>Ranking de Quiz</h1>

            <div class="setup">
                <label for="player-input">Participante</label>
                <input id="player-input" type="text" placeholder="Ex.: Sofia">
                <button id="start-button" type="button">Iniciar tentativa</button>
            </div>

            <div class="question-box">
                <p id="progress-label" class="progress-label">0 de 0</p>
                <h2 id="question-title">Inicie uma tentativa</h2>
                <div id="options-list" class="options-list"></div>
            </div>

            <button id="abandon-button" type="button">Abandonar tentativa</button>
            <p id="message" class="message"></p>
        </section>

        <section class="panel ranking-panel">
            <div class="section-header">
                <h2>Ranking</h2>
                <span id="ranking-count">0 resultados</span>
            </div>
            <div id="ranking-list" class="ranking-list"></div>
        </section>
    </main>
</body>
</html>
