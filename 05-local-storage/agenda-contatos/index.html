<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Contatos</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Mural de Contatos da Escola</h1>
        <p class="intro">Organize contatos por categoria, destaque favoritos e filtre rapidamente por nome.</p>

        <section class="painel formulario">
            <label for="input-nome">Nome</label>
            <input id="input-nome" type="text" placeholder="Ex.: Júlia Alves">

            <label for="input-telefone">Telefone</label>
            <input id="input-telefone" type="text" placeholder="Ex.: (51) 99999-0000">

            <label for="input-categoria">Categoria</label>
            <select id="input-categoria">
                <option value="">Selecione</option>
                <option value="Colega">Colega</option>
                <option value="Professor">Professor(a)</option>
                <option value="Administrativo">Administrativo</option>
                <option value="Terceirizado">Terceirizado</option>
            </select>

            <button id="btn-adicionar" type="button">Adicionar contato</button>
            <p id="mensagem" class="mensagem"></p>
        </section>

        <section class="painel filtro">
            <label for="input-busca">Buscar por nome</label>
            <input id="input-busca" type="text" placeholder="Digite parte do nome">
        </section>

        <section class="painel lista">
            <h2>Contatos cadastrados</h2>
            <div id="lista-contatos" class="grade-contatos"></div>
        </section>
    </main>
</body>
</html>
