<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Conselho de Classe</h1>
        <p class="intro">Cadastre notas por bimestre, calcule situação e mantenha o boletim salvo no navegador.</p>

        <section class="painel formulario">
            <label for="input-nome">Nome do estudante</label>
            <input id="input-nome" type="text" placeholder="Ex.: Camila Dias">

            <label for="input-turma">Turma</label>
            <select id="input-turma">
                <option value="">Selecione</option>
                <option value="2AM-G1">2AM-G1</option>
                <option value="2AT-G1">2AT-G1</option>
                <option value="2AM-G2">2AM-G2</option>
                <option value="2AT-G2">2AT-G2</option>
            </select>

            <div class="linha-notas">
                <div>
                    <label for="input-nota1">Nota 1º sem</label>
                    <input id="input-nota1" type="number" step="0.1" min="0" max="10" placeholder="0 a 10">
                </div>
                <div>
                    <label for="input-nota2">Nota 2º sem</label>
                    <input id="input-nota2" type="number" step="0.1" min="0" max="10" placeholder="0 a 10">
                </div>
            </div>

            <label for="input-observacao">Observação curta</label>
            <input id="input-observacao" type="text" placeholder="Ex.: participação constante">

            <div class="linha-botoes">
                <button id="btn-cadastrar" type="button">Adicionar ao boletim</button>
                <button id="btn-limpar" type="button" class="secundario">Limpar cadastro</button>
            </div>

            <p id="mensagem" class="mensagem"></p>
        </section>

        <section class="painel resumo">
            <div>
                <span class="rotulo">Total de estudantes</span>
                <strong id="total-alunos">0 estudante(s)</strong>
            </div>
            <div>
                <span class="rotulo">Média da turma</span>
                <strong id="media-geral">0,0</strong>
            </div>
            <div>
                <span class="rotulo">Aprovados</span>
                <strong id="total-aprovados">0</strong>
            </div>
            <div>
                <span class="rotulo">Recuperação</span>
                <strong id="total-recuperacao">0</strong>
            </div>
        </section>

        <section class="painel lista">
            <h2>Boletim da turma</h2>
            <div class="tabela-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Turma</th>
                            <th>Média</th>
                            <th>Situação</th>
                            <th>Observação</th>
                        </tr>
                    </thead>
                    <tbody id="lista-alunos"></tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
