<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Alunos</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Cadastro de Alunos</h1>
        <p class="intro">Carregue a lista uma vez no início, atualize a memória e regrave o storage sempre que o cadastro mudar.</p>

        <section class="painel formulario">
            <label for="input-nome">Nome</label>
            <input id="input-nome" type="text" placeholder="Ex.: Camila Dias">

            <label for="input-turma">Turma</label>
            <input id="input-turma" type="text" placeholder="Ex.: 2AM">

            <label for="input-media">Média</label>
            <input id="input-media" type="number" step="0.1" min="0" max="10" placeholder="Ex.: 8.5">

            <div class="linha-botoes">
                <button id="btn-cadastrar" type="button">Cadastrar aluno</button>
                <button id="btn-limpar" type="button" class="secundario">Limpar cadastro</button>
            </div>

            <p id="mensagem" class="mensagem"></p>
        </section>

        <section class="painel resumo">
            <div>
                <span class="rotulo">Total de alunos</span>
                <strong id="total-alunos">0</strong>
            </div>
            <div>
                <span class="rotulo">Média geral</span>
                <strong id="media-geral">0.0</strong>
            </div>
        </section>

        <section class="painel lista">
            <h2>Alunos cadastrados</h2>
            <ul id="lista-alunos"></ul>
        </section>
    </main>
</body>
</html>
