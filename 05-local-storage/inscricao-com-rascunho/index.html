<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição com Rascunho</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Inscrição com Rascunho</h1>
        <p class="intro">Use `localStorage` para a lista confirmada e `sessionStorage` para proteger o formulário em andamento.</p>

        <section class="painel formulario">
            <label for="input-nome">Nome</label>
            <input id="input-nome" type="text" placeholder="Ex.: Pedro Lima">

            <label for="input-email">E-mail</label>
            <input id="input-email" type="email" placeholder="Ex.: pedro@escola.com">

            <label for="select-turno">Turno</label>
            <select id="select-turno">
                <option value="">Selecione</option>
                <option value="Manhã">Manhã</option>
                <option value="Tarde">Tarde</option>
                <option value="Noite">Noite</option>
            </select>

            <div class="linha-botoes">
                <button id="btn-inscrever" type="button">Confirmar inscrição</button>
                <button id="btn-limpar-rascunho" type="button" class="secundario">Limpar rascunho</button>
            </div>

            <p id="mensagem" class="mensagem"></p>
        </section>

        <section class="painel lista">
            <h2>Inscrições confirmadas</h2>
            <ul id="lista-inscricoes"></ul>
        </section>
    </main>
</body>
</html>
