<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição com Rascunho</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Inscrição com Rascunho</h1>
        <p class="intro">Salve rascunho automático na sessão e confirme inscrições completas no armazenamento local.</p>

        <section class="painel formulario">
            <label for="input-nome">Nome</label>
            <input id="input-nome" type="text" placeholder="Ex.: Pedro Lima">

            <label for="input-email">E-mail</label>
            <input id="input-email" type="email" placeholder="Ex.: pedro@escola.com">

            <label for="select-turno">Turno</label>
            <select id="select-turno">
                <option value="">Selecione</option>
                <option value="Manhã">Manhã</option>
                <option value="Tarde">Tarde</option>
                <option value="Noite">Noite</option>
            </select>

            <fieldset class="grupo-oficinas">
                <legend>Oficinas de interesse (escolha pelo menos 1)</legend>
                <label class="check-opcao">
                    <input type="checkbox" name="oficina" value="Web Design">
                    Web Design
                </label>
                <label class="check-opcao">
                    <input type="checkbox" name="oficina" value="Robótica">
                    Robótica
                </label>
                <label class="check-opcao">
                    <input type="checkbox" name="oficina" value="Programação de Jogos">
                    Programação de Jogos
                </label>
            </fieldset>

            <label for="input-justificativa">Por que você quer participar?</label>
            <textarea id="input-justificativa" rows="4" maxlength="160" placeholder="Escreva uma justificativa curta."></textarea>
            <p class="apoio">Caracteres: <strong id="contador-caracteres">0/160</strong></p>

            <div class="linha-botoes">
                <button id="btn-inscrever" type="button">Confirmar inscrição</button>
                <button id="btn-limpar-rascunho" type="button" class="secundario">Limpar rascunho</button>
            </div>

            <p id="mensagem" class="mensagem"></p>
        </section>

        <section class="painel lista">
            <h2>Inscrições confirmadas</h2>
            <div id="lista-inscricoes" class="grade-inscricoes"></div>
        </section>
    </main>
</body>
</html>
