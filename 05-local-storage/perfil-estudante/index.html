<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Estudante</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Perfil do Estudante</h1>
        <p class="intro">Monte um cartão escolar com prévia em tempo real e salve o perfil no navegador.</p>

        <section class="painel painel-grid">
            <form class="formulario" autocomplete="off">
                <label for="input-nome">Nome completo</label>
                <input id="input-nome" type="text" placeholder="Ex.: Ana Souza">

                <label for="input-turma">Turma</label>
                <input id="input-turma" type="text" placeholder="Ex.: 2AT">

                <label for="input-curso">Curso</label>
                <select id="input-curso">
                    <option value="">Selecione</option>
                    <option value="Informática">Informática</option>
                    <option value="Mecatrônica">Mecatrônica</option>
                </select>

                <label for="input-ano">Ano escolar</label>
                <input id="input-ano" type="range" min="1" max="4" value="1">
                <p class="apoio">Ano selecionado: <strong id="texto-ano">1º ano</strong></p>

                <label for="input-cor">Cor de destaque</label>
                <input id="input-cor" type="color" value="#1f6feb">

                <label class="checkbox">
                    <input id="input-monitoria" type="checkbox">
                    Quero participar da monitoria da turma.
                </label>

                <div class="linha-botoes">
                    <button id="btn-salvar" type="button">Salvar perfil</button>
                    <button id="btn-limpar" type="button" class="secundario">Limpar perfil</button>
                </div>

                <p id="mensagem" class="mensagem"></p>
            </form>

            <section class="resumo" aria-live="polite">
                <h2>Prévia do cartão</h2>
                <article id="cartao-perfil" class="cartao-perfil">
                    <div id="iniciais" class="iniciais">ES</div>
                    <p id="preview-nome" class="nome">Estudante sem nome</p>
                    <p id="preview-turma">Turma: -</p>
                    <p id="preview-curso">Curso: -</p>
                    <p id="preview-ano">Ano: -</p>
                    <p id="preview-monitoria">Monitoria: não informado</p>
                </article>
            </section>
        </section>
    </main>
</body>
</html>
