<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de produtos</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
</head>
<body>
    <header class="cabecalho">
        <div class="cabecalho-conteudo">
            <h1>➕ Cadastro de produtos</h1>

            <nav class="menu">
                <a href="../">Início</a>
                <a href="../lista/">Lista</a>
                <a href="./" class="ativo">Cadastro</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h2>Novo produto</h2>

        <form class="formulario">
            <label class="campo">
                Nome *
                <input name="nome" type="text" required placeholder="Ex.: Caderno Universitário">
            </label>

            <label class="campo">
                Categoria
                <select name="categoria">
                    <option value="Papelaria">Papelaria</option>
                    <option value="Material Escolar">Material Escolar</option>
                    <option value="Organização">Organização</option>
                    <option value="Eletrônicos">Eletrônicos</option>
                    <option value="Casa">Casa</option>
                    <option value="Outros" selected>Outros</option>
                </select>
            </label>

            <label class="campo">
                Preço (R$)
                <input name="preco" type="number" min="0" step="0.10" placeholder="0.00">
                <small>Use ponto para os centavos: 24.90</small>
            </label>

            <label class="campo">
                Descrição
                <textarea name="descricao"></textarea>
            </label>

            <button type="submit" class="botao botao-azul">Cadastrar produto</button>
            <a class="botao" href="../lista/">Ver a lista de produtos</a>
        </form>
    </main>
</body>
</html>
